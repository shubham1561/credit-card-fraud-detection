# Every setting the pipeline uses. Each metrics JSON stores a copy of this file.
# Relative paths are resolved against the repository root, not the shell's working folder.
seed: 42

data:
  raw_path: data/raw/creditcard.csv
  # Public mirror fetched by `python -m src.data --download`. The committed reports were
  # produced from this exact file (its SHA-256 is in reports/data_checks.json).
  download_url: https://raw.githubusercontent.com/nsethi31/Kaggle-Data-Credit-Card-Fraud-Detection/master/creditcard.csv

paths:
  reports: reports          # data_checks.json, metrics/, figures/, scores/, results.md
  models: models

protocols:
  random:                   # Protocol A: stratified hold-out + CV on the training part
    test_size: 0.2
    cv_folds: 5
  time:                     # Protocol B: earliest -> train, next -> validation, latest -> test
    fractions: [0.6, 0.2, 0.2]

models:                     # override the defaults in src/models.py (docs section 7)
  logreg: {C: 1.0, max_iter: 5000}
  rf: {n_estimators: 300, min_samples_leaf: 2}
  xgb: {n_estimators: 400, learning_rate: 0.05, max_depth: 5, subsample: 0.8, colsample_bytree: 0.8}
class_weighting: [true, false]   # every model is trained both ways (experiment E2)

costs:
  c_review: 1.0             # unit: the cost of reviewing one alert
  main_cost_ratio: 20       # a missed fraud costs this many reviews (justified in docs 2.2)
  sweep_ratios: [2, 5, 10, 20, 50, 100, 200, 500]
  amount_based:             # E6: a miss costs its amount plus handling; every alert costs a review
    review_cost: 5.0
    miss_handling_cost: 0.0

evaluation:
  bootstrap_resamples: 2000
  bootstrap_seed: 0
  recall_at_fpr: 0.01
  top_k: [50, 100, 200]

bundle:                     # the model the API serves (saved by the time protocol)
  path: models/model_bundle.joblib
  protocol: time
  model: xgb
  weighted: true
